[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-drama-studio-backend"
version = "0.1.0"
description = "Backend foundation for AI Drama Studio"
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.13,<2",
    "asyncpg>=0.29,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "Pillow>=10,<12",
    "python-multipart>=0.0.9,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2,<3",
    "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
